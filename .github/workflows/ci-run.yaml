name: Run unit tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: 
        - "**"
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - prod
          - dev
          - pre-prod
      headless:
        description: 'Run tests in headless mode'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
    

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./jest
        run: npm ci

      - name: Run tests
        working-directory: ./jest
        run: npm test